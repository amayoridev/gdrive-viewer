<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo link xem ảnh</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #1c1e21;
            margin-bottom: 10px;
        }
        p {
            color: #606770;
            margin-bottom: 30px;
        }
        #link-form {
            display: flex;
            flex-direction: column;
        }
        #drive-url {
            padding: 15px;
            font-size: 16px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        #drive-url:focus {
            border-color: #0d8de5;
            outline: none;
        }
        button {
            background-color: #0d8de5;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0b70b8;
        }
        #notification {
            margin-top: 15px;
            color: #31a24c;
            font-weight: bold;
            display: none;
        }
        a{
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Điều khoản sử dụng</h1>
        <p>(1) Đây là dự án phi lợi nhuận, vui lòng không sao chép có phí dưới mọi hình thức.</p>
        <p>(2) Vui lòng không báo cáo API key được nhúng trong mã, nó đã được bảo mật.</p>
        <p>(3) Toàn bộ dự án đang được host trên Github</p>
        <button onclick="location.href='./'">Trở lại</button>
    </div>

    <script>
        const linkForm = document.getElementById('link-form');
        const driveUrlInput = document.getElementById('drive-url');
        const notification = document.getElementById('notification');

        linkForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const driveUrl = driveUrlInput.value.trim();
            if (!driveUrl) {
                alert('Vui lòng nhập link Google Drive!');
                return;
            }

            // Tạo link tới trang view.html
            const viewPageUrl = new URL('view.html', window.location.href);
            viewPageUrl.searchParams.set('url', driveUrl);
            const finalUrl = viewPageUrl.href;

            // Sao chép link vào clipboard
            navigator.clipboard.writeText(finalUrl).then(() => {
                // Hiển thị thông báo và chuyển hướng
                notification.textContent = '✅ Đã sao chép link vào clipboard! Đang chuyển hướng...';
                notification.style.display = 'block';

                setTimeout(() => {
                    window.location.href = finalUrl;
                }, 1500); // Chờ 1.5 giây để người dùng đọc thông báo

            }).catch(err => {
                console.error('Không thể sao chép link: ', err);
                // Nếu không sao chép được, vẫn chuyển hướng
                notification.textContent = 'Đang chuyển hướng...';
                notification.style.display = 'block';
                 setTimeout(() => {
                    window.location.href = finalUrl;
                }, 1000);
            });
        });
    </script>
</body>
</html>
